<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RL Build Time Log</title>
<style>
/* Paper & ink, matching the rice: Rosé Pine Dawn, Fraunces for the clock and headings,
   IBM Plex Sans for text, IBM Plex Mono for small uppercase labels. Fonts are the
   ones the rice installs, so the page works offline. */
:root{color-scheme:light;--bg:#faf4ed;--card:#fffaf3;--fold:#f2e9e1;--ink:#575279;--grey:#6e6a86;--line:#dfdad9;--rose:#d7827e;--red:#b4637a;--pine:#286983;--gold:#b0700f;--soft:#f2e9e1;--live:#f6e6e3;
 --serif:"Fraunces","IBM Plex Serif",Georgia,serif;--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);overflow-x:clip}
.band{padding:clamp(24px,4vw,52px) max(5vw,16px);max-width:1240px;margin:0 auto}
.band+.band{padding-top:0}
h1,h2,h3,.big{font-family:var(--serif);font-weight:400;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,5vw,44px);font-style:italic;color:var(--grey)}
h2{font-size:26px;border-top:1px solid var(--line);padding-top:18px;margin:0 0 14px;position:relative}
h2::before{content:"";position:absolute;left:0;top:-1px;width:56px;height:2px;background:var(--rose)}
h3{font-size:19px;margin:0 0 6px}
.sub{color:var(--grey);margin:8px 0 0;max-width:68ch}
.now{margin-top:22px;padding:22px 28px 22px 36px;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 24px rgba(87,82,121,.08);display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 36px;align-items:end;position:relative}
.now::before{content:"";position:absolute;left:18px;top:22px;bottom:22px;width:1.5px;background:var(--rose);opacity:.45}
.clock{font-size:clamp(64px,11vw,128px);font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.now.run .clock{color:var(--ink)}.now.brk .clock{color:var(--grey)}.now.over .clock{color:var(--red)}
.what{font-family:var(--serif);font-size:24px;line-height:1.25}
.state{color:var(--grey);font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
.dot{color:var(--rose)}.brk .dot{color:var(--grey)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.sep{width:1px;height:32px;background:var(--line);margin:0 4px}
button{font:500 15px var(--sans);min-height:44px;padding:0 18px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;border-radius:12px;box-shadow:0 2px 6px rgba(87,82,121,.06)}
button:hover{border-color:var(--rose)}
button.pri{background:var(--ink);border-color:var(--ink);color:var(--card)}
button.red{background:var(--red);border-color:var(--red);color:#fff}
button.small{min-height:36px;padding:0 13px;font-size:14px}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat{padding:12px 16px 16px 0;border-bottom:1px solid var(--line)}
.stat b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(28px,4vw,36px);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.2}
.stat span{color:var(--grey);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.proj{font-family:var(--serif);font-size:19px;max-width:70ch;margin:18px 0 4px}
.proj b{font-weight:500}
.days .row{display:grid;grid-template-columns:7.5em minmax(0,1fr) 4.8em;gap:12px;align-items:center;padding:3px 0;font-variant-numeric:tabular-nums}
.bar{height:14px;background:var(--fold);border-radius:7px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink);border-radius:7px}
.row.today .bar i{background:var(--rose)}
.days .v{text-align:right;white-space:nowrap}.lbl{color:var(--grey);white-space:nowrap;font-family:var(--mono);font-size:12px}
details{border-top:1px solid var(--line);padding:14px 0}
summary{cursor:pointer;font-family:var(--serif);font-size:21px;list-style:none;display:flex;gap:4px 12px;align-items:baseline;flex-wrap:wrap}
summary::-webkit-details-marker{display:none}
summary .meta{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey)}
table{width:100%;border-collapse:collapse;margin-top:8px}
th{text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);font-weight:400;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.id{font-family:var(--mono);font-weight:500;white-space:nowrap}
td.act{white-space:nowrap;text-align:right}
tr.live td{background:var(--live)}
.add{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
input,textarea,select{font:16px var(--sans);min-height:44px;padding:8px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px}
.add input{flex:1 1 240px}
textarea{width:100%;min-height:150px;font-family:var(--mono);font-size:14px}
input.min{width:5.5em}
.note{color:var(--grey);font-size:14px;margin:6px 0}
.warn{color:var(--red);font-weight:500}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px 48px}
.cols h3:not(:first-child){margin-top:24px}
.nudge{margin-top:16px;padding:16px 20px;border:1px solid var(--rose);border-radius:16px;background:var(--live);font-family:var(--serif);font-size:19px}
.nudge .btns{margin-top:10px;font-family:var(--sans)}
select{min-height:40px;padding:0 8px}
.setl{line-height:2.4;margin:0}
code{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
.ovl{position:fixed;inset:0;background:rgba(87,82,121,.35);display:grid;place-items:center;padding:16px;z-index:9}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 24px;width:min(540px,100%);max-height:90vh;overflow:auto;box-shadow:0 16px 40px rgba(87,82,121,.18)}
.box h2{border:0;padding:0;font-size:24px}.box h2::before{display:none}
.box label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);margin-top:14px}
.box input{width:100%}
.brow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;margin-top:6px}
#err{color:var(--red)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:12px;font-size:14px;z-index:10}
@media(prefers-reduced-motion:no-preference){.run .dot{animation:blink 2s infinite}.over .clock{animation:blink 1s infinite}}
@keyframes blink{50%{opacity:.3}}
@media(max-width:600px){.now{grid-template-columns:1fr;padding:18px 18px 18px 30px}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:6.5em;margin-inline-start:-7em;color:var(--grey);font-weight:400}.stack td:empty{display:none}td.act{text-align:start}.days .row{grid-template-columns:5.8em minmax(0,1fr) 4.4em}.brow{grid-template-columns:1fr}.sep{display:none}}
</style></head><body><div id="root"></div>
<script>{
const LS='rl-timelog-local-v1',LSB='rl-timelog-beat',MIN=6e4,HR=36e5,DAY=864e5;
const SEED={rev:0,active:null,brk:null,lastBackup:null,settings:{work:50,rest:10},phases:[
 {id:'0',name:'Workbench',steps:[
  {id:'0.1',name:'Repo scaffold and test harness',pre:true},{id:'0.2',name:'Load the policy',pre:true},
  {id:'0.3',name:'Batched generation with padding'},{id:'0.4',name:'Per-token logprobs (gate 1)'},
  {id:'0.5',name:'Seeding and determinism (gate 2)'},{id:'0.6',name:'Run logger'},
  {id:'0.7',name:'Checkpoint and resume (gate 3)'},{id:'0.8',name:'Gate run and tag'}]},
 {id:'1',name:'Thin slice: the whole loop, crude',steps:[]},{id:'2',name:'RL foundations in depth',steps:[]},
 {id:'3',name:'Post-training methods',steps:[]},{id:'4',name:'Rewards, verifiers and evals',steps:[]},
 {id:'5',name:'Environments and agentic RL',steps:[]},{id:'6',name:'RL systems at scale',steps:[]},
 {id:'7',name:'GPU performance',steps:[]},{id:'8',name:'Capstone: RL-trained kernel-optimising agent',steps:[]}]};
let S=null,mode='browser',diskOk=true,ed=null,rec=null,needArm=false,wasOver=false,wasDue=false,snooze=0,nextChime=0,lastBeat=null;
const root=document.getElementById('root');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now();
const steps=()=>S.phases.flatMap(p=>p.steps);
const find=id=>steps().find(s=>s.id===id);
const pad=n=>String(n).padStart(2,'0');
function dur(ms){const m=Math.round(Math.max(0,ms)/MIN);return m<60?m+'m':Math.floor(m/60)+'h '+pad(m%60)+'m';}
function clock(ms){const t=Math.floor(Math.max(0,ms)/1000);return Math.floor(t/3600)+':'+pad(Math.floor(t%3600/60))+':'+pad(t%60);}
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes());};
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const dlabel=t=>new Date(t).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const when=t=>t?dlabel(t)+', '+hm(t):'';
const midnight=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();};
const toInput=t=>{if(!t)return'';const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());};
const fromInput=v=>v?new Date(v).getTime():null;

/* ---------- sound: the alarm is scheduled on the audio clock, so a background tab can't delay it ---------- */
let ac=null,alarm=null;
function unlock(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){}}
function armAlarm(at){try{unlock();disarm();
  const start=ac.currentTime+Math.max(0.05,(at-now())/1000);
  const car=ac.createOscillator();car.type='sine';car.frequency.value=880;
  const g=ac.createGain();g.gain.value=0.17;
  const lfo=ac.createOscillator();lfo.type='square';lfo.frequency.value=1.4;
  const lg=ac.createGain();lg.gain.value=0.17;lfo.connect(lg);lg.connect(g.gain);
  car.connect(g);g.connect(ac.destination);car.start(start);lfo.start(start);alarm={car,lfo,g};needArm=false;}catch(e){}}
function disarm(){if(!alarm)return;try{alarm.car.stop();alarm.lfo.stop();alarm.g.disconnect();}catch(e){}alarm=null;}
function chime(){if(!ac||ac.state!=='running')return;const t0=ac.currentTime;
  for(let i=0;i<3;i++){const o=ac.createOscillator(),g=ac.createGain(),a=t0+i*.35;o.frequency.value=660;
    g.gain.setValueAtTime(0,a);g.gain.linearRampToValueAtTime(.22,a+.02);g.gain.linearRampToValueAtTime(0,a+.25);
    o.connect(g);g.connect(ac.destination);o.start(a);o.stop(a+.3);}}

/* ---------- time maths. A break is [start, end, planned ms, kind]; kind 'off' = page wasn't running ---------- */
function brks(s,t){const b=(s.breaks||[]).map(x=>[x[0],x[1],x[2]||0,x[3]||'']);if(S.brk&&S.brk.step===s.id)b.push([S.brk.s,t,S.brk.plan||0,'']);return b.sort((a,c)=>a[0]-c[0]);}
function segs(s,t){if(!s.start)return[];const end=s.end||(S.active===s.id?t:s.start);const out=[];let cur=s.start;
  for(const[a,b]of brks(s,t)){if(a>cur)out.push([cur,Math.min(a,end)]);cur=Math.max(cur,b);}
  if(end>cur)out.push([cur,end]);return out.filter(x=>x[1]>x[0]);}
const work=(s,t)=>segs(s,t).reduce((a,x)=>a+x[1]-x[0],0);
const realBrks=(s,t)=>brks(s,t).filter(b=>b[3]!=='off');
const brkMs=(s,t)=>realBrks(s,t).reduce((a,x)=>a+Math.max(0,x[1]-x[0]),0);
const nBrk=(s,t)=>realBrks(s,t).length;
function merged(t){const all=steps().filter(s=>s.start).flatMap(s=>segs(s,t)).sort((a,b)=>a[0]-b[0]);const m=[];
  for(const x of all){const l=m[m.length-1];if(l&&x[0]-l[1]<2*MIN)l[1]=Math.max(l[1],x[1]);else m.push([x[0],x[1]]);}return{all,m};}
function contWork(t){if(!S.active||S.brk)return 0;const l=merged(t).m.pop();return l&&t-l[1]<5000?t-l[0]:0;}
const due=t=>S.settings.work>0&&t>=snooze&&contWork(t)>=S.settings.work*MIN;
function stats(t){
  const tr=steps().filter(s=>s.start),{all,m}=merged(t);
  const longest=m.reduce((a,x)=>Math.max(a,x[1]-x[0]),0);
  const day={};for(const[a,b]of all){let x=a;while(x<b){const e=Math.min(b,midnight(x)+DAY);const k=dkey(x);day[k]=(day[k]||0)+e-x;x=e;}}
  const total=all.reduce((a,x)=>a+x[1]-x[0],0);
  let bc=0,bt=0,pc=0,over=0;const isBreak=(a,b)=>b>a&&b-a<3*HR&&dkey(a)===dkey(b);
  for(const s of tr)for(const[a,b,p]of realBrks(s,t))if(isBreak(a,b)){bc++;bt+=b-a;if(p){pc++;over+=Math.max(0,b-a-p);}}
  const ord=tr.slice().sort((a,b)=>a.start-b.start);
  for(let i=1;i<ord.length;i++){const p=ord[i-1].end,n=ord[i].start;if(p&&isBreak(p,n)){bc++;bt+=n-p;}}
  let week=0;for(let i=0;i<7;i++)week+=day[dkey(t-i*DAY)]||0;
  const doneW=tr.filter(s=>s.end).map(s=>work(s,t)).sort((a,b)=>a-b),n=doneW.length;
  const med=n?(n%2?doneW[(n-1)/2]:(doneW[n/2-1]+doneW[n/2])/2):0;
  const rem=steps().filter(s=>!s.end&&!s.pre);
  const remWork=rem.reduce((a,s)=>a+(s.start?Math.max(0,med-work(s,t)):med),0);
  const first=tr.length?Math.min(...tr.map(s=>s.start)):null;
  const cal=first?Math.round((midnight(t)-midnight(first))/DAY)+1:0;
  const pace=cal?total/cal:0;
  const proj=n>=2&&pace>0?{days:remWork/pace,remWork,rem:rem.length}:null;
  return{day,total,longest,bc,bt,pc,over,focus:total+bt?total/(total+bt):null,today:day[dkey(t)]||0,week,med,n,pace,proj};
}

/* ---------- storage: disk through saver.py when served from it, else this browser ---------- */
function save(){S.rev=(S.rev||0)+1;render();persist();beat(true);}
async function persist(){const snap=JSON.stringify(S);
  try{localStorage.setItem(LS,snap);}catch(e){}
  if(mode!=='disk')return;
  try{const r=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:snap});
    if(r.status===409){const j=await r.json();if(j.state){S=j.state;render();toast('Another tab had newer changes; showing those');}}
    else if(!r.ok)throw new Error(r.status);
    else if(!diskOk){diskOk=true;render();}}
  catch(e){diskOk=false;render();toast('Couldn’t reach the saver. Is it running?');}}
function beat(force){if(rec||!S)return;if(!force&&!(S.active||S.brk))return;lastBeat=now();
  if(mode==='disk')fetch('/api/beat',{method:'PUT'}).catch(()=>{});else try{localStorage.setItem(LSB,String(lastBeat));}catch(e){}}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3500);}
function download(){const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='rl-timelog-backup-'+dkey(now())+'.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);S.lastBackup=now();save();}
function valid(o){return o&&Array.isArray(o.phases)&&o.phases.every(p=>p&&p.id!=null&&Array.isArray(p.steps));}
function restore(txt){let o;try{o=JSON.parse(txt);}catch(e){return toast('That file isn’t a backup');}
  if(!valid(o))return toast('That file isn’t a backup');
  if(!confirm('Replace everything on this page with the backup?'))return;
  disarm();const r=S.rev||0;S=o;S.rev=Math.max(r,o.rev||0);S.settings=S.settings||{work:50,rest:10};
  if(typeof S.brk==='number')S.brk={s:S.brk,plan:0,step:S.active};save();toast('Backup restored');}

/* ---------- step import: "Phase 1 — name" lines and "1.3 Step name" lines ---------- */
function importSteps(txt){
  const t=txt.trim();if(!t)return;
  if(t[0]==='{')return restore(t);
  let ph=null,added=0,renamed=0;
  const ensure=id=>{let p=S.phases.find(x=>x.id===id);if(!p){p={id,name:'',steps:[]};S.phases.push(p);S.phases.sort((a,b)=>+a.id-+b.id);}return p;};
  const put=(p,id,name)=>{const ex=p.steps.find(s=>s.id===id);if(ex){if(ex.name!==name){ex.name=name;renamed++;}}else{p.steps.push({id,name,breaks:[]});added++;}
    p.steps.sort((a,b)=>+a.id.split('.')[1]-+b.id.split('.')[1]);};
  for(const raw of t.split(/\r?\n/)){const line=raw.replace(/^[\s\-*•]+|\s+$/g,'').replace(/^\[[ x]\]\s*/i,'');if(!line)continue;
    let m=line.match(/^phase\s+(\d+)\s*(?:[—–:\-]+\s*(.*))?$/i);
    if(m){ph=ensure(m[1]);if(m[2]&&!ph.name)ph.name=m[2];continue;}
    m=line.match(/^(\d+)\.(\d+)[.):]?\s+(.+)$/);
    if(m){put(ensure(m[1]),m[1]+'.'+m[2],m[3].trim());continue;}
    m=line.match(/^(\d+)[.)]\s+(.+)$/);
    if(m&&ph)put(ph,ph.id+'.'+m[1],m[2].trim());}
  if(!added&&!renamed)return toast('No steps found. Use lines like “1.1 Step name”.');
  save();toast(added+' steps added'+(renamed?', '+renamed+' renamed':''));
}

/* ---------- render ---------- */
const stat=(v,l,id)=>`<div class="stat"><b${id?' id="'+id+'"':''}>${v}</b><span>${l}</span></div>`;
function breakBtns(){return `<button class="small" data-a="brk" data-m="5">Break 5 min</button><button class="small" data-a="brk" data-m="15">Break 15 min</button><button class="small" data-a="brk" data-m="30">Break 30 min</button><input class="min" id="bmin" type="number" min="1" max="240" placeholder="min" aria-label="Custom break minutes"><button class="small" data-a="brk" data-m="custom">Go</button><button class="small" data-a="brk" data-m="0">Break, no timer</button>`;}
function boardHTML(t){
  const cur=S.active&&find(S.active),next=steps().find(s=>!s.start&&!s.pre&&!s.end);
  if(S.brk){const b=S.brk,end=b.plan?b.s+b.plan:null,left=end?end-t:null,over=end&&left<=0;
    const stateTxt=over?`Break’s over — ${dur(-left)} past the ${dur(b.plan)} you planned`:end?`On a ${dur(b.plan)} break · back at ${hm(end)}`:`On a break since ${hm(b.s)}`;
    const back=cur?`<button class="${over?'red':'pri'}" data-a="resume">Back to work</button>`:next?`<button class="${over?'red':'pri'}" data-a="startnext">Start ${esc(next.id)}</button><button class="small" data-a="endidle">End break</button>`:`<button class="${over?'red':'pri'}" data-a="endidle">End break</button>`;
    return `<section class="now ${over?'over':'brk'}" aria-live="polite"><div class="big clock" id="clock">${over?'+'+clock(-left):end?clock(left):clock(t-b.s)}</div><div><div class="state"><span class="dot">●</span> ${stateTxt}</div><div class="what">${cur?esc(cur.id)+' — '+esc(cur.name)+' (paused)':'Between steps'}</div>${needArm&&end?'<div class="warn">Click anywhere on the page so the alarm can sound.</div>':''}</div></section><div class="btns">${back}${cur?`<button class="small" data-a="done">Done, tick ${esc(cur.id)}</button>`:''}</div>`;}
  if(cur){const c=contWork(t),r=S.settings.rest;
    return `<section class="now run" aria-live="polite"><div class="big clock" id="clock">${clock(work(cur,t))}</div><div><div class="state"><span class="dot">●</span> Working since ${hm(cur.start)}${nBrk(cur,t)?' · '+nBrk(cur,t)+(nBrk(cur,t)===1?' break, ':' breaks, ')+dur(brkMs(cur,t))+' so far':''}${c>=2*MIN?' · '+dur(c)+' since your last break':''}</div><div class="what">${esc(cur.id)} — ${esc(cur.name)}</div></div></section>
    ${due(t)?`<div class="nudge"><b>${dur(c)} without a break.</b> Time for a ${r} min break: stand up, look away from the screen.<div class="btns"><button class="red" data-a="brk" data-m="${r}">Take a ${r} min break</button><button class="small" data-a="snooze">Remind me in 10 min</button></div></div>`:''}
    <div class="btns"><button class="red" data-a="done">Done, tick ${esc(cur.id)}</button><span class="sep"></span>${breakBtns()}<span class="sep"></span><button class="small" data-a="cancel">Undo start</button></div>`;}
  return `<section class="now"><div class="big clock">0:00:00</div><div><div class="state">Nothing running</div><div class="what">${next?'Next: '+esc(next.id)+' — '+esc(next.name):'No steps waiting. Paste the next phase’s steps below.'}</div></div></section><div class="btns">${next?`<button class="pri" data-a="start" data-id="${esc(next.id)}">Start ${esc(next.id)}</button><span class="sep"></span>`:''}${breakBtns()}</div>`;
}
function render(){
  if(!S)return;
  const t=now(),st=stats(t);
  const unwritten=S.phases.filter(p=>!p.steps.length).length,P=st.proj;
  const proj=P?`<p class="proj"><b>At your pace so far</b> (${dur(st.pace)} of work per calendar day, a typical step taking ${dur(st.med)}), the ${P.rem} steps written so far need about ${dur(P.remWork)} more: roughly ${Math.max(1,Math.ceil(P.days))} days, so around ${dlabel(t+P.days*DAY)}.</p><p class="note">${unwritten} phases have no steps yet, so they aren’t in this estimate. It gets sharper with every step you tick.</p>`
    :`<p class="note">A finish estimate appears once you’ve ticked two timed steps.</p>`;
  const days=[];for(let i=13;i>=0;i--){const d=t-i*DAY;days.push({l:dlabel(d),v:st.day[dkey(d)]||0,today:!i});}
  const mx=Math.max(4*HR,...days.map(d=>d.v));
  const dayRows=days.map(d=>`<div class="row${d.today?' today':''}"><span class="lbl">${d.l}</span><div class="bar"><i style="width:${(d.v/mx*100).toFixed(1)}%"></i></div><span class="v">${d.v?dur(d.v):'–'}</span></div>`).join('');
  const firstOpen=S.phases.find(p=>!p.steps.length||p.steps.some(s=>!s.end&&!s.pre));
  const phases=S.phases.map(p=>{
    const tot=p.steps.length,dn=p.steps.filter(s=>s.end||s.pre).length,w=p.steps.reduce((a,s)=>a+(s.start?work(s,t):0),0);
    const rows=p.steps.map(s=>{const live=S.active===s.id,fresh=!s.start&&!s.pre&&!s.end;
      const status=s.pre?'Done before tracking':s.end?'Done':live?(S.brk?'On break':'Running'):'Not started';
      let a=fresh?`<button class="small" data-a="start" data-id="${esc(s.id)}"${S.active?' disabled':''}>Start</button> `:live?`<button class="small red" data-a="done">Done</button> `:'';
      a+=`<button class="small" data-a="edit" data-id="${esc(s.id)}">Edit</button>`;
      if(fresh)a+=` <button class="small" data-a="del" data-id="${esc(s.id)}">Delete</button>`;
      return `<tr class="${live?'live':''}"><td class="id" data-l="Step">${esc(s.id)}</td><td data-l="Name">${esc(s.name)}</td><td data-l="Status">${status}</td><td class="n" data-l="Started">${when(s.start)}</td><td class="n" data-l="Finished">${when(s.end)}</td><td class="n" data-l="Work">${s.start?dur(work(s,t)):''}</td><td class="n" data-l="Breaks">${s.start&&nBrk(s,t)?nBrk(s,t)+' · '+dur(brkMs(s,t)):''}</td><td class="act" data-l=" ">${a}</td></tr>`;}).join('');
    return `<details${p===firstOpen?' open':''}><summary>Phase ${esc(p.id)}${p.name?' — '+esc(p.name):''}<span class="meta">${tot?dn+' of '+tot+' steps done':'steps not written yet'}${w?' · '+dur(w)+' of work':''}</span></summary>
    ${tot?`<table class="stack"><thead><tr><th>Step</th><th>Name</th><th>Status</th><th class="n">Started</th><th class="n">Finished</th><th class="n">Work</th><th class="n">Breaks</th><th></th></tr></thead><tbody>${rows}</tbody></table>`:''}
    <div class="add"><input id="add-${esc(p.id)}" data-p="${esc(p.id)}" placeholder="Add one step to Phase ${esc(p.id)}" aria-label="New step for Phase ${esc(p.id)}"><button class="small" data-a="add" data-id="${esc(p.id)}">Add step</button></div></details>`;}).join('');
  const lb=S.lastBackup,stale=!lb||t-lb>7*DAY;
  const keep=mode==='disk'?(diskOk?'<p class="note"><b>Saved to disk</b> on every click, in <code>~/.local/share/rl-timelog/data/state.json</code>, with a daily copy kept for 30 days. A power cut loses nothing you clicked.</p>':'<p class="warn">The saver isn’t answering, so clicks are only kept in this browser for now. Check it with <code>systemctl --user status rl-timelog</code>.</p>')
    :mode==='none'?'<p class="warn">This browser won’t keep data for this page. Open it at http://localhost:8765, or in a normal (not private) window.</p>'
    :`<p class="note">Saved in this browser only — opened as a plain file, without the saver. Open http://localhost:8765 instead. ${lb?'Last backup: '+when(lb)+'.':'No backup yet.'}</p>${stale?'<p class="warn">Download a backup — it’s been over a week, or you’ve never made one.</p>':''}`;
  const sel=(id,vals,cur,lab)=>`<select id="${id}" aria-label="${lab}">${vals.map(v=>`<option value="${v[0]}"${+cur===v[0]?' selected':''}>${v[1]}</option>`).join('')}</select>`;
  const reminder=`<p class="setl">Remind me to take a break after ${sel('s-work',[[25,'25 min'],[50,'50 min'],[90,'90 min'],[0,'never']],S.settings.work,'Work time before a break reminder')} of unbroken work, and suggest ${sel('s-rest',[[5,'5 min'],[10,'10 min'],[15,'15 min']],S.settings.rest,'Suggested break length')} breaks.</p>`;
  root.innerHTML=`<div class="band"><h1>RL build, time log</h1><p class="sub">Start a step when you sit down to it, take a break when you step away, tick it when it passes review. The page reads the clock; everything below comes from those clicks.</p>${boardHTML(t)}</div>
  <div class="band"><h2>How it’s going</h2><div class="stats">${stat(dur(st.today),'worked today','today')}${stat(dur(st.week),'worked in the last 7 days')}${stat(st.focus==null?'—':Math.round(st.focus*100)+'%','focus: work ÷ (work + breaks)')}${stat(st.bc?st.bc+' · '+dur(st.bt/st.bc):'—','breaks · average length')}${stat(st.pc?dur(st.over):'—','timed breaks ran over by, in total')}${stat(st.longest?dur(st.longest):'—','longest unbroken stretch')}${stat(st.n?dur(st.med):'—','typical step (median)')}</div>${proj}<p class="note">Breaks are your timed and untimed pauses plus gaps between steps, if under 3 hours on the same day. Anything longer counts as stopping for the day. Time the page wasn’t running (power cuts) is left out of everything.</p></div>
  <div class="band"><h2>Last 14 days</h2><div class="days">${dayRows}</div></div>
  <div class="band"><h2>Phases and steps</h2>${phases}</div>
  <div class="band"><h2>Add a new phase’s steps</h2><div class="cols"><div><p class="note">Paste the step list Claude gives you when a phase opens. One step per line, like:</p><textarea id="imp" spellcheck="false" placeholder="Phase 1 — Thin slice&#10;1.1 Environment interface&#10;1.2 Math verifier&#10;1.3 REINFORCE with a baseline"></textarea><div class="btns"><button class="pri" data-a="imp">Add these steps</button></div><p class="note">Steps already here keep their times; only new ones are added and changed names are updated.</p></div>
  <div><h3>Break reminder</h3>${reminder}<div class="btns"><button class="small" data-a="test">Test the sounds</button></div><h3>Your data</h3>${keep}<div class="btns"><button class="small" data-a="backup">Download backup</button><button class="small" data-a="pick">Restore from backup…</button><input type="file" id="file" accept=".json,application/json" hidden></div></div></div></div>${ed?modal():''}${rec?recHTML():''}`;
}
function recHTML(){return `<div class="ovl"><div class="box" role="dialog" aria-modal="true" aria-label="The page was off"><h2>The page was off for ${dur(now()-rec.from)}</h2><p>Last seen ${when(rec.from)}, while <b>${esc(rec.id)}</b> was running — a power cut, the browser closing, or the laptop asleep.</p><div class="btns"><button class="pri" data-a="recoff">Leave that time out</button><button data-a="recwork">I was working anyway</button></div><p class="note">“Leave it out” pauses the step from ${hm(rec.from)} until you click, and doesn’t count it as a break either.</p></div></div>`;}
function modal(){const d=ed.d;
  const br=d.breaks.map((b,i)=>`<div class="brow"><input type="datetime-local" data-bs="${i}" value="${toInput(b[0])}" aria-label="Break ${i+1} start"><input type="datetime-local" data-be="${i}" value="${toInput(b[1])}" aria-label="Break ${i+1} end"><button class="small" data-a="rmb" data-i="${i}">Remove</button></div>${b[3]==='off'?'<p class="note">Page was off (left out of stats)</p>':''}`).join('');
  return `<div class="ovl"><div class="box" role="dialog" aria-modal="true" aria-label="Edit step ${esc(ed.id)}"><h2>Edit ${esc(ed.id)}</h2>
  <label for="e-name">Step name</label><input id="e-name" value="${esc(d.name)}">
  <label for="e-start">Started</label><input id="e-start" type="datetime-local" value="${toInput(d.start)}">
  <label for="e-end">Finished${S.active===ed.id?' (leave empty while it’s running)':''}</label><input id="e-end" type="datetime-local" value="${toInput(d.end)}">
  <label>Breaks (start, end)</label>${br||'<p class="note">No breaks recorded.</p>'}
  <div class="btns"><button class="small" data-a="addb">Add a break</button></div>
  <p class="note" id="err"></p><div class="btns"><button class="pri" data-a="esave">Save</button><button data-a="eclose">Cancel</button></div></div></div>`;}
function readEd(){const d=ed.d,q=s=>document.querySelector(s);d.name=q('#e-name').value.trim()||d.name;d.start=fromInput(q('#e-start').value);d.end=fromInput(q('#e-end').value);
  d.breaks=d.breaks.map((b,i)=>[fromInput(q(`[data-bs="${i}"]`).value),fromInput(q(`[data-be="${i}"]`).value),b[2]||0,b[3]||'']);}

/* ---------- actions ---------- */
function closeBreak(t){if(!S.brk)return;const s=S.brk.step&&find(S.brk.step);if(s)(s.breaks=s.breaks||[]).push([S.brk.s,t,S.brk.plan||0]);S.brk=null;disarm();document.title='RL Build Time Log';}
const A={
  start(id){if(S.active)return;const s=find(id);if(!s)return;const t=now();closeBreak(t);s.start=t;s.end=null;s.breaks=[];S.active=id;snooze=0;save();},
  startnext(){const n=steps().find(s=>!s.start&&!s.pre&&!s.end);if(n)A.start(n.id);},
  brk(_,el){if(S.brk)return;let m=el.dataset.m;if(m==='custom'){m=+document.getElementById('bmin').value;if(!(m>0&&m<=240))return toast('Enter minutes, 1 to 240');}else m=+m;
    const t=now();S.brk={s:t,plan:m*MIN,step:S.active||null};snooze=0;nextChime=0;if(m)armAlarm(t+m*MIN);save();},
  resume(){closeBreak(now());save();},
  endidle(){closeBreak(now());save();},
  snooze(){snooze=now()+10*MIN;nextChime=0;render();},
  done(){const s=find(S.active);if(!s)return;const t=now();closeBreak(t);s.end=t;S.active=null;save();},
  cancel(){const s=find(S.active);if(!s)return;if(!confirm('Discard the start time of '+s.id+'?'))return;s.start=null;s.breaks=[];S.active=null;save();},
  del(id){const s=find(id);if(!s||!confirm('Delete step '+id+'?'))return;for(const p of S.phases)p.steps=p.steps.filter(x=>x.id!==id||x.start||x.pre);save();},
  add(pid){const inp=document.getElementById('add-'+pid),name=inp&&inp.value.trim();if(!name)return;const p=S.phases.find(x=>x.id===pid);
    const n=Math.max(0,...p.steps.map(s=>+s.id.split('.')[1]||0))+1;p.steps.push({id:pid+'.'+n,name,breaks:[]});save();},
  imp(){importSteps(document.getElementById('imp').value);},
  backup(){download();},
  pick(){document.getElementById('file').click();},
  test(){chime();setTimeout(()=>{armAlarm(now());setTimeout(disarm,1500);},1300);},
  recoff(){const s=find(rec.id);if(s)(s.breaks=s.breaks||[]).push([rec.from,now(),0,'off']);rec=null;save();},
  recwork(){rec=null;save();},
  edit(id){const s=find(id);if(!s)return;ed={id,d:{name:s.name,start:s.start||null,end:s.end||null,breaks:(s.breaks||[]).map(b=>[b[0],b[1],b[2]||0,b[3]||''])}};render();},
  addb(){readEd();ed.d.breaks.push([null,null,0,'']);render();},
  rmb(_,el){readEd();ed.d.breaks.splice(+el.dataset.i,1);render();},
  eclose(){ed=null;render();},
  esave(){readEd();const d=ed.d,err=m=>{document.getElementById('err').textContent=m;};
    if(d.end&&!d.start)return err('Add a start time first.');
    if(d.start&&d.end&&d.end<=d.start)return err('The finish has to be after the start.');
    if(d.start&&d.start>now()+MIN)return err('The start is in the future.');
    const bs=d.breaks.filter(b=>b[0]&&b[1]);
    if(bs.some(b=>b[1]<=b[0]))return err('Each break has to end after it starts.');
    if(bs.some(b=>b[0]<d.start||(d.end&&b[1]>d.end)))return err('Breaks have to fall inside the step.');
    const s=find(ed.id);s.name=d.name;s.start=d.start;s.end=d.start?d.end:null;s.breaks=d.start?bs:[];
    if(s.start&&s.end)s.pre=false;
    if(S.active===s.id&&(!s.start||s.end)){if(S.brk&&S.brk.step===s.id){if(s.end)s.breaks.push([S.brk.s,Math.max(S.brk.s,s.end),S.brk.plan||0]);S.brk=null;disarm();}S.active=null;}
    ed=null;save();}
};
root.addEventListener('click',e=>{unlock();const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el.dataset.id,el);}});
root.addEventListener('keydown',e=>{const p=e.target.dataset&&e.target.dataset.p;if(e.key==='Enter'&&p){e.preventDefault();A.add(p);}if(e.key==='Enter'&&e.target.id==='bmin'){e.preventDefault();A.brk(null,{dataset:{m:'custom'}});}if(e.key==='Escape'&&ed){ed=null;render();}});
root.addEventListener('change',e=>{const id=e.target.id;
  if(id==='file'&&e.target.files[0])e.target.files[0].text().then(restore);
  if(id==='s-work'||id==='s-rest'){S.settings[id==='s-work'?'work':'rest']=+e.target.value;snooze=0;nextChime=0;save();}});
/* reopening mid-break: the browser only lets sound start after a click */
document.addEventListener('pointerdown',()=>{unlock();if(needArm&&S&&S.brk&&S.brk.plan){const end=S.brk.s+S.brk.plan;needArm=false;if(end>now())armAlarm(end);const w=document.querySelector('.now .warn');if(w)w.remove();}},true);
window.addEventListener('storage',e=>{if(mode==='browser'&&e.key===LS&&e.newValue){try{S=JSON.parse(e.newValue);render();}catch(x){}}});
setInterval(()=>beat(),30000);
setInterval(()=>{if(!S||rec)return;const t=now(),c=document.getElementById('clock');
  if(S.brk){const b=S.brk,end=b.plan?b.s+b.plan:null,over=!!end&&t>=end;
    if(over!==wasOver){wasOver=over;if(!ed)render();}
    if(c)c.textContent=over?'+'+clock(t-end):end?clock(end-t):clock(t-b.s);
    document.title=over?(t%2000<1000?'⏰ Break’s over':'Back to work'):end?clock(end-t)+' · break':'Break';return;}
  wasOver=false;const cur=S.active&&find(S.active);if(!cur)return;
  if(c)c.textContent=clock(work(cur,t));
  const d=due(t);if(d!==wasDue){wasDue=d;if(!ed)render();}
  if(d&&t>=nextChime){chime();nextChime=t+10*MIN;}
  document.title=(d?'☕ Break time · ':'')+clock(work(cur,t))+' · '+cur.id;
  const td=document.getElementById('today');if(td)td.textContent=dur(stats(t).today);},1000);

(async()=>{
  if(/^https?:$/.test(location.protocol)){try{const r=await fetch('/api/state',{cache:'no-store'});if(r.ok){const j=await r.json();mode='disk';S=j.state||null;lastBeat=j.beat||null;}}catch(e){}}
  if(mode==='browser'){try{S=JSON.parse(localStorage.getItem(LS)||'null');lastBeat=+localStorage.getItem(LSB)||null;}catch(e){mode='none';}}
  if(!S)S=JSON.parse(JSON.stringify(SEED));
  S.settings=S.settings||{work:50,rest:10};
  if(typeof S.brk==='number')S.brk={s:S.brk,plan:0,step:S.active};
  if(S.brk&&S.brk.plan)needArm=true;
  const t=now(),cur=S.active&&find(S.active),gap=lastBeat&&t-lastBeat>3*MIN;
  if(gap&&S.brk&&lastBeat>=S.brk.s){closeBreak(lastBeat);needArm=false;if(!cur){render();save();return;}}
  if(gap&&cur&&!S.brk&&lastBeat>=cur.start)rec={from:lastBeat,id:cur.id};
  if(needArm&&S.brk){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume().then(()=>{if(needArm&&S.brk&&S.brk.plan&&ac.state==='running'){needArm=false;armAlarm(S.brk.s+S.brk.plan);if(!ed&&!rec)render();}});}catch(e){}}
  render();beat();
})();
}</script></body></html>
