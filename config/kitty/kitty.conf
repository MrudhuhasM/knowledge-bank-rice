# Knowledge Bank: kitty (paper & ink / Rosé Pine Dawn)
font_family      JetBrainsMono Nerd Font
font_size        11.5
window_padding_width 16
background_opacity 0.96
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
cursor_blink_interval 0.6
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
scrollback_lines 5000
url_style curly

foreground            #575279
background            #faf4ed
selection_foreground  #575279
selection_background  #dfdad9
cursor                #cecacd
cursor_text_color     #575279
url_color             #907aa9
active_border_color   #d7827e
inactive_border_color #dfdad9

active_tab_foreground   #575279
active_tab_background   #f2e9e1
inactive_tab_foreground #9893a5
inactive_tab_background #faf4ed

# ANSI colours, remapped so every colour is readable on paper:
# "white" (7/15) are dark inks, "black" (0) is a soft line colour.
color0  #dfdad9
color8  #7f7a93
color1  #b4637a
color9  #a0475f
color2  #286983
color10 #1f5a70
color3  #b0700f
color11 #b06d12
color4  #4a8792
color12 #3f7d88
color5  #907aa9
color13 #7a6396
color6  #bb625e
color14 #c0645f
color7  #6e6a86
color15 #575279
