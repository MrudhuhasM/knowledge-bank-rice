# hypridle: dim → lock → screen off → suspend
# Every step goes through kb-idle, which does nothing while a step or a break is
# running in the RL time log: you're working on the other laptop, and this one has
# to stay awake, readable and loud enough for the break alarm.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 5 min: dim the screen
listener {
    timeout = 300
    on-timeout = ~/.local/bin/kb-idle dim
    on-resume = ~/.local/bin/kb-idle undim
}

# 10 min: lock
listener {
    timeout = 600
    on-timeout = ~/.local/bin/kb-idle lock
}

# 11 min: screen off
listener {
    timeout = 660
    on-timeout = ~/.local/bin/kb-idle off
    on-resume = ~/.local/bin/kb-idle on
}

# 30 min: suspend
listener {
    timeout = 1800
    on-timeout = ~/.local/bin/kb-idle suspend
}
