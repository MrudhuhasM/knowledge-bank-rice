# hyprlock: a quiet page with the time, the date and one of your own highlights.

$serif = IBM Plex Serif
$sans  = IBM Plex Sans
$ink   = rgb(575279)
$muted = rgb(9893a5)
$rose  = rgb(d7827e)

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/.local/share/kb/wallpaper.png
    blur_passes = 2
    blur_size = 4
    brightness = 1.0
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $ink
    font_size = 110
    font_family = $serif
    position = 0, 190
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $rose
    font_size = 20
    font_family = $serif Italic
    position = 0, 80
    halign = center
    valign = center
}

# Password
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    outer_color = $rose
    inner_color = rgb(fffaf3)
    font_color = $ink
    check_color = rgb(ea9d34)
    fail_color = rgb(b4637a)
    fade_on_empty = false
    placeholder_text = <i>password</i>
    rounding = 14
    position = 0, -40
    halign = center
    valign = center
}

# A highlight from your vault (lines starting with "> ")
label {
    monitor =
    text = cmd[update:0] ~/.local/bin/kb-quote
    color = $muted
    font_size = 14
    font_family = $serif Italic
    position = 0, 80
    halign = center
    valign = bottom
}
