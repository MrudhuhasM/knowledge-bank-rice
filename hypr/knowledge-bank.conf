# ── Knowledge Bank ───────────────────────────────────────────────
# Sourced from your Hyprland config by install.sh. Everything lives behind
# one key (Super+K) so it won't clash with your existing dotfiles' binds.
#
#   Super+K, then:
#     C  capture a thought to Inbox     P  capture the clipboard
#     D  today's note (Neovim)          Shift+D  today's note (Obsidian)
#     N  new note                       Shift+N  new source (book/article)
#     S  search everything              R  review session
#     O  open Obsidian                  V  open the vault in Neovim
#     I  open Inbox                     H  open Home (vault index)
#     F  toggle focus mode              Esc  cancel
#
# To use a different leader key, change SUPER, K on the two lines below.

$kb = ~/.local/bin

bind = SUPER, K, exec, notify-send -t 4000 -a "Knowledge Bank" "Super+K …" "C capture · P clip · D daily · N note · ⇧N source\nS search · R review · O Obsidian · V vim · I inbox · H home · F focus"
bind = SUPER, K, submap, kb

submap = kb
bind = , C, exec, $kb/kb-capture
bind = , C, submap, reset
bind = , P, exec, $kb/kb-capture --clip
bind = , P, submap, reset
bind = , D, exec, $kb/kb-daily
bind = , D, submap, reset
bind = SHIFT, D, exec, $kb/kb-daily --obsidian
bind = SHIFT, D, submap, reset
bind = , N, exec, $kb/kb-new
bind = , N, submap, reset
bind = SHIFT, N, exec, $kb/kb-new --source
bind = SHIFT, N, submap, reset
bind = , S, exec, $kb/kb-search
bind = , S, submap, reset
bind = , R, exec, $kb/kb-review
bind = , R, submap, reset
bind = , O, exec, obsidian
bind = , O, submap, reset
bind = , V, exec, $kb/kb-open
bind = , V, submap, reset
bind = , I, exec, $kb/kb-open inbox
bind = , I, submap, reset
bind = , H, exec, $kb/kb-open home
bind = , H, submap, reset
bind = , F, exec, $kb/kb-focus
bind = , F, submap, reset
bind = , escape, submap, reset
submap = reset
